<!DOCTYPE html>
<!-- src/shared-v2/window.html -- authored from docs/window-ui/SRS.md (not
     copied from src/shared/window.html), reusing src/shared/'s CSS files
     and the same element ids/classes wherever an FR names them as part of
     a reused library's contract (socket.ts, switch/disclosure components,
     the vendored rtsp-over-websocket element) -- see docs/window-ui/DESIGN.md. -->
<html data-theme="dark">
  <head>
    <meta charset='UTF-8'>
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=4.0, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="external-lib/vis/vis.css">

    <link rel="stylesheet" type="text/css" href="css/window.css" async>
    <link rel="stylesheet" type="text/css" href="css/switch.css" async>
    <link rel="stylesheet" type="text/css" href="css/disclosure.css" async>
    <link rel="stylesheet" type="text/css" href="css/calendar.css" async>
    <link rel="stylesheet" type="text/css" href="css/modal.css" async>

    <link rel="stylesheet" type="text/css" href="css/table.css">
    <link rel="stylesheet" type="text/css" href="css/event-timeline.css">

    <script type="text/javascript" src="scripts/socket.js"></script>

    <script type="module" src="external-lib/rtsp-over-websocket/rtsp-over-websocket.esm.js"></script>
    <script type="module" src="scripts/legacy-globals-bridge.js"></script>

    <script type="text/javascript" src="window.js"></script>
  </head>
  <body>
    <div id="container" class="container">
      <div id="left_panel">
        <div class="video sameRow">
          <rtsp-over-websocket class="rtsp-over-websocket" id="rtsp-over-websocket1" channel="1" profile="H.264" port="80" device="camera"
            width="640px" height="320px" username="admin" statistics></rtsp-over-websocket>
        </div>
      </div>
      <div id="right_panel">
        <div id="drag"></div>
        <div id="discovery" class="toolbar">
          <div class="toolbar-group">
            <button id="init">Start Discovery</button>
            <button id="disconnect" disabled="disabled">Stop Discovery</button>
            <button id="web" disabled="disabled">Show Web Area</button>
            <label class="toolbar-checkbox">
              <input type="checkbox" id="auto_discovery_toggle">
              Run discovery automatically (minimized window)
            </label>
          </div>
          <div class="toolbar-group">
            <label id="theme_switch" for="toggle">
              <input type="checkbox" id="toggle" checked />
            </label>
            <div class="theme-icon">
              <img src="https://img.icons8.com/emoji/32/000000/crescent-moon-emoji.png" />
              <em>Dark Mode</em>
            </div>
          </div>
        </div>
        <div class="panel-stack">
          <div class="panel">
            <label for="debug" class="panel-title">Discovery result</label>
            <div class="discovery">
              <div class="datatable-toolbar">
                <input type="search" id="datatable_search" placeholder="Search">
                <label for="discovery_view_type">View:</label>
                <select id="discovery_view_type">
                  <option value="table">Table</option>
                  <option value="topology">Star Topology</option>
                </select>
                <span id="discovery_topology_group_by_wrap" style="display:none">
                  <label for="discovery_topology_group_by">Group by:</label>
                  <select id="discovery_topology_group_by">
                    <option value="ip">IP Address</option>
                    <option value="name">Name</option>
                    <option value="mac">MAC Address</option>
                    <option value="port">Port</option>
                    <option value="protocol">Protocol</option>
                  </select>
                </span>
              </div>
              <div class="datatable-scroll">
                <table id="datatable" class="dataTable" width="100%">
                  <thead>
                    <tr>
                      <th data-column="0">Name</th>
                      <th data-column="1">IP Address</th>
                      <th data-column="2">MAC Address</th>
                      <th data-column="3">Port</th>
                      <th data-column="4">Http URL</th>
                      <th data-column="5">Protocol</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
              <div id="datatable_topology" style="display:none"></div>
              <div id="datatable_info" class="datatable-info"></div>
            </div>
          </div>
        </div>
        <div class="panel-stack">
          <div class="panel">
            <label for="debug" class="panel-title">Control</label>
            <div class="panel-body">
              <div id="user_info" class="panel-subgroup">
                <p class="subgroup-title">Session</p>
                <div class="flex field-row">
                  <div id="player_list_div" class="field"></div>
                  <div id="user" class="field-row">
                    <label for="username">User:</label>
                    <input type="text" id="username" value="admin">
                    <label for="password">Password:</label>
                    <div class="password-field">
                      <input type="password" id="password" value="password">
                      <button type="button" id="password_toggle" class="password-toggle" aria-label="Show password" aria-pressed="false">
                        <svg class="icon-eye" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
                          <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
                          <path d="M2 4.27 3.28 3 21 20.72 19.73 22l-3.06-3.06A11.6 11.6 0 0 1 12 19c-5 0-9.27-3.11-11-7a12.4 12.4 0 0 1 4.11-5.14L2 4.27zM12 7c5 0 9.27 3.11 11 7a12.4 12.4 0 0 1-3.16 4.15l-2.2-2.2A5 5 0 0 0 12 8c-.36 0-.71.03-1.05.09L8.9 6.04A11.6 11.6 0 0 1 12 7zm-3.47 2.53L12 13a3 3 0 0 1-3.47-3.47z"/>
                        </svg>
                      </button>
                    </div>
                  </div>
                  <div class="field">
                    <label for="statistics">Show Statistics:
                      <input id="statistics" type="checkbox">
                    </label>
                  </div>
                </div>
              </div>
              <div id="device" class="panel-subgroup">
                <p class="subgroup-title">Device</p>
                <div class="field-row">
                  <div id="device_info" class="field">
                    <label for="device_type">Type:</label>
                    <select id="device_type">
                      <option value="camera">Camera</option>
                      <option value="nvr">NVR</option>
                    </select>
                  </div>
                  <div id="hostname_info" class="field">
                    <label for="hostname">Hostname:</label>
                    <input type="text" id="hostname" size="16" value="">
                  </div>
                  <div id="port_info" class="field">
                    <label for="port">Port:</label>
                    <input type="text" id="port" size="4" value="">
                  </div>
                  <div id="channel_info" class="field">
                    <label for="channel">Channel:</label>
                    <input type="text" id="channel" size="4" value="1">
                  </div>
                  <div id="profile_info" class="field">
                    <label for="profile">Profile:</label>
                    <input type="textbox" id="profile" size="10" value="">
                  </div>
                  <div id="time_info" class="field-row">
                    <div id="sunapi_info" class="field">
                      <label class="switch">SUNAPI:</label>
                      <div id="sunapi_toggle">
                        <input id="use_sunapi_client_checkbox" type="checkbox">
                      </div>
                    </div>
                    <div class="field">
                      <input id="use_gmt" type="checkbox">
                      <label for="use_gmt">Use timezone</label>
                    </div>
                    <div class="field">
                      <label for="timezone">Timezone:</label>
                      <select id="timezone">
                        <option value="-12">GMT-12:00</option>
                        <option value="-11">GMT-11:00</option>
                        <option value="-10">GMT-10:00</option>
                        <option value="-9.5">GMT-09:30</option>
                        <option value="-9">GMT-09:00</option>
                        <option value="-8">GMT-08:00</option>
                        <option value="-7">GMT-07:00</option>
                        <option value="-6">GMT-06:00</option>
                        <option value="-5">GMT-05:00</option>
                        <option value="-4">GMT-04:00</option>
                        <option value="-3.5">GMT-03:30</option>
                        <option value="-3">GMT-03:00</option>
                        <option value="-2">GMT-02:00</option>
                        <option value="-1">GMT-01:00</option>
                        <option value="0">GMT</option>
                        <option value="1">GMT+01:00</option>
                        <option value="2">GMT+02:00</option>
                        <option value="3">GMT+03:00</option>
                        <option value="3.5">GMT+03:30</option>
                        <option value="4">GMT+04:00</option>
                        <option value="4.5">GMT+04:30</option>
                        <option value="5">GMT+05:00</option>
                        <option value="5.5">GMT+05:30</option>
                        <option value="6">GMT+06:00</option>
                        <option value="6.5">GMT+06:30</option>
                        <option value="7">GMT+07:00</option>
                        <option value="8">GMT+08:00</option>
                        <option value="9">GMT+09:00</option>
                        <option value="9.5">GMT+09:30</option>
                        <option value="10">GMT+10:00</option>
                        <option value="10.5">GMT+10:30</option>
                        <option value="11">GMT+11:00</option>
                        <option value="12">GMT+12:00</option>
                        <option value="13">GMT+13:00</option>
                      </select>
                    </div>
                    <div class="field">
                      <label for="universaltime_checkbox">Coordinate UTC Time:</label>
                      <input id="universaltime_checkbox" type="checkbox">
                    </div>
                    <div class="field">
                      <label class="switch">Protocol:</label>
                      <div id="http_type_toggle" role="tablist" aria-label="Protocol">
                        <input type="radio" name="http_type" id="http_radio" value="http" checked>
                        <label for="http_radio">HTTP</label>
                        <input type="radio" name="http_type" id="https_radio" value="https">
                        <label for="https_radio">HTTPS</label>
                      </div>
                    </div>
                    <div id="native_tls_proxy_field" class="field">
                      <input id="use_native_tls_proxy_checkbox" type="checkbox">
                      <label for="use_native_tls_proxy_checkbox">Bypass Untrusted Certificate (Native Host)</label>
                    </div>
                    <!-- src/shared-v2/-only. Used to live inside
                         #playback_control_calendar (FR-7.8.1), fetched only
                         once that Calendar panel first showed -- moved here,
                         fetched as soon as SUNAPI turns On regardless of
                         Play Type (device.ts's on_change_use_sunapi_client()
                         -> playbackCalendar.ts's fetchDeviceLanguage()), per
                         the user's explicit request. Still read by
                         playbackCalendar.ts's refreshEventRules() (FR-7.8.2)
                         when the Calendar panel does show -- unchanged, just
                         populated earlier now. -->
                    <div class="field">
                      <label for="event_rules_language">Language:</label>
                      <select id="event_rules_language"></select>
                    </div>
                    <div class="field">
                      <label for="is_android">Is Android?</label>
                      <input id="is_android" type="checkbox">
                    </div>
                  </div>
                </div>
              </div>
              <div id="video_source_group" class="panel-subgroup">
                <p class="subgroup-title">Video Source (selected channel)</p>
                <div id="video_source_summary" class="field-row"></div>
                <div id="video_profile_list" class="profile-list"></div>
              </div>
              <div id="video_control_info" class="panel-subgroup">
                <p class="subgroup-title">Video Control</p>
                <div id="video_control" class="field-row">
                  <div class="field" id="live_control">
                    <label>Control:</label>
                    <button id="play_button">Play</button>
                    <button id="stop_button">Stop</button>
                    <button id="pause_button">Pause</button>
                    <button id="resume_button">Resume</button>
                    <button id="capture_button">Download Img.</button>
                    <button id="capture2_button">Capture</button>
                  </div>
                  <div class="field-row">
                    <div class="field">
                      <label class="switch">Play Type:</label>
                      <div id="play_type_toggle" role="tablist" aria-label="Play type">
                        <input type="radio" name="play_type" id="live_radio" value="live" checked>
                        <label for="live_radio">Live</label>
                        <input type="radio" name="play_type" id="playback_radio" value="playback">
                        <label for="playback_radio">Playback</label>
                      </div>
                    </div>
                    <div class="field" id="framedrop_info">
                      <input id="framedrop" type="checkbox" checked="false">
                      <label for="framedrop">FrameDrop</label>
                    </div>
                    <div class="field" id="iframe_info">
                      <input id="iframe" type="checkbox" checked="false">
                      <label for="iframe">I Frame Only</label>
                    </div>
                    <div class="field" id="reconnect_info">
                      <input id="reconnect" type="checkbox" checked="false">
                      <label for="reconnect">Reconnect:</label>
                    </div>
                    <div class="field">
                      <input id="minimap" type="checkbox" checked="false">
                      <label for="minimap">Show Minimap</label>
                    </div>
                    <div class="field">
                      <input id="bestshot" type="checkbox" checked="false">
                      <label for="bestshot">Show AI Bestshotp</label>
                    </div>
                    <div class="field" id="renderer_info">
                      <label for="renderer_type">Renderer Type:</label>
                      <select id="renderer_type">
                        <option value="null">null</option>
                        <option value="video" selected>video tag</option>
                        <option value="canvas">canvas tag</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
              <div id="playback_control" class="panel-subgroup" style="display:none;">
                <p class="subgroup-title">Playback</p>
                <!-- FR-7.1 v2.0 (docs/window-ui/SRS.md): search is driven
                     entirely by the shared Event Timeline widget's own
                     1H/6H/1D/1W/1M/1Y preset buttons (a default "1 day
                     ending now" search auto-fires the first time this
                     panel becomes visible) -- there is no typed date-range
                     input here any more. Overlapped Id (FR-15,
                     event-timeline-component's SRS) now lives inside that
                     same widget's own toolbar (#timeline, below), not a
                     standalone field here -- shared with the Calendar
                     panel's equivalent flow, same as Selected Time. -->
                <div class="field-row">
                  <div class="field">
                    <label class="switch">AI Search:</label>
                    <button id="search_aitimeline">Search AI Timeline</button>
                    <button id="search_three_month_aitimeline">Search 3 Month AI Timeline</button>
                  </div>
                </div>
              </div>
              <!-- FR-7.8 (src/shared-v2/-only, docs/window-ui/SRS.md): shown
                   instead of #playback_control above when SUNAPI is On and
                   Playback mode is selected -- see
                   updatePlaybackSunapiUIVisibility() (playbackCalendar.ts).
                   Wrapped together with #timeline (below) in
                   #playback-calendar-timeline purely for layout -- see that
                   wrapper's own comment for why #timeline itself still
                   isn't nested inside this panel. The wrapper's own
                   show/hide (Playback -> shown, Live -> hidden) is driven
                   explicitly in updatePlaybackSunapiUIVisibility(), same
                   pattern as #playback_video_controls right below. -->
              <div id="playback-calendar-timeline" class="playback-calendar-timeline-row">
                <div id="playback_control_calendar" class="panel-subgroup" style="display:none;">
                  <p class="subgroup-title">Playback (SUNAPI)</p>
                  <!-- Language moved to the Device panel's #time_info row
                       (next to Is Android?) -- see its own comment there. -->
                  <div class="field-row">
                    <div id="playback_calendar"></div>
                  </div>
                  <!-- Rule used to be a static field here (a "calendar_search_area"
                       field-row, shown/hidden together with Overlapped Id).
                       Manual Start/End Time lived here too until the v2.0
                       Playback search redesign (docs/window-ui/SRS.md
                       FR-7.8.2/FR-7.8.5/event-timeline-component's FR-11) --
                       moved into the shared Event Timeline widget as
                       "Selected Time", used by both this panel and
                       #playback_control (FR-7.1). Overlapped Id itself
                       (FR-15) moved the same way, into that same widget's own
                       toolbar (#timeline, below). Rule (FR-16) followed the
                       identical move, since it's likewise a Timeline search
                       filter, not a device-wide setting like Language -- no
                       longer a field here at all, not even a hidden one:
                       event-timeline.ts's renderRuleTypes() (playbackCalendar.ts's
                       ensureEventTimelineShell()/populateRuleSelect()) builds
                       the actual `#event_rules_type` select on demand, inside
                       #timeline. -->
                </div>
                <!-- Shared by #playback_control (above, OUTSIDE this row) and
                     #playback_control_calendar (this row's other child) --
                     updateTimeline(), docs/window-ui/SRS.md FR-7.6 -- still a
                     SIBLING of #playback_control_calendar, not nested inside
                     it, so it stays visible/populatable regardless of which
                     of the two search panels is currently shown (a
                     display:none ancestor would hide it too, per FR-7.8's
                     DESIGN.md). This row exists only to place #timeline
                     beside #playback_control_calendar when the Calendar flow
                     is active (requested directly by the user); when the
                     manual flow (#playback_control) is active instead,
                     #playback_control_calendar is display:none and #timeline
                     is simply this row's only child, unaffected. -->
                <div class="field event-timeline-slot" id="timeline"></div>
              </div>
              <!-- Video-playback controls (Forward/Backward/Speed, ISO Type
                   Data Time, Seeking Date/Time, BestshotFilter) -- these
                   control an already-playing stream, they are not part of
                   either flow's *search* UI, so (like #timeline above) this
                   is a deliberate SIBLING of #playback_control/
                   #playback_control_calendar, gated only on Playback mode
                   itself (isPlayback), not on showManual/showCalendar. This
                   used to live nested inside #playback_control, which meant
                   switching to the Calendar/SUNAPI flow hid Seeking Date/
                   Time (and every other control here) along with the manual
                   search fields they had nothing to do with -- reported
                   directly by the user. -->
              <div id="playback_video_controls" class="panel-subgroup" style="display:none;">
                <div class="field-row">
                  <div class="field">
                    <label class="switch">Control:</label>
                    <button id="forward">Forward</button>
                    <button id="backward">Backward</button>
                    <select id="speed">
                      <option value="0.25">0.25x</option>
                      <option value="0.5">0.5x</option>
                      <option value="0.75">0.75x</option>
                      <option value="+0.0">+0.0x</option>
                      <option value="1" selected>1x</option>
                      <option value="2">2x</option>
                      <option value="4">4x</option>
                      <option value="8">8x</option>
                      <option value="16">16x</option>
                      <option value="32">32x</option>
                      <option value="64">64x</option>
                      <option value="128">128x</option>
                      <option value="256">256x</option>
                      <option value="-0.25">-0.25x</option>
                      <option value="-0.5">-0.5x</option>
                      <option value="-0.75">-0.75x</option>
                      <option value="-0.0">-0.0x</option>
                      <option value="-1">-1x</option>
                      <option value="-2">-2x</option>
                      <option value="-4">-4x</option>
                      <option value="-8">-8x</option>
                      <option value="-16">-16x</option>
                      <option value="-32">-32x</option>
                      <option value="-64">-64x</option>
                      <option value="-128">-128x</option>
                      <option value="-256">-256x</option>
                    </select>
                  </div>
                  <div class="field">
                    <input type="checkbox" id="iso_date_time_checkbox" name="isodatetime">
                    <label for="iso_date_time_checkbox">ISO Type Data Time</label>
                  </div>
                  <!-- Seeking Date/Time used to be a separate, static field
                       pair here. Unified into #timestamp_date/#timestamp_time
                       (dynamically created in #live_control, same as 'live'
                       mode already did) per the user's explicit request --
                       see playback.ts's updateTimestampReadout(). -->
                  <div class="field">
                    <input type="checkbox" id="use_bestshotfilter">
                    <label for="bestshotfileter">BestshotFilter:</label>
                    <select id="bestshotfileter">
                      <option value="Person">Person</option>
                      <option value="Face">Face</option>
                      <option value="FaceRecognition">FaceRecognition</option>
                      <option value="Vehicle">Vehicle</option>
                      <option value="LicensePlate">LicensePlate</option>
                    </select>
                  </div>
                </div>
              </div>
              <div id="audio">
                <div class="field-row">
                  <div class="field">
                    <label class="switch">Audio Control:</label>
                  </div>
                  <div class="field">
                    <button id="unmute">Unmute</button>
                    <button id="mute">Mute</button>
                  </div>
                  <div class="field">
                    <label class="switch" for="volume">Volume Level:</label>
                    <select id="volume">
                      <option value="0">Level 1</option>
                      <option value="1">Level 2</option>
                      <option value="2">Level 3</option>
                      <option value="3">Level 4</option>
                      <option value="4">Level 5</option>
                      <option value="5">Level 6</option>
                    </select>
                  </div>
                  <div class="field">
                    <label class="switch" for="getaudiovolume">Volume Input(0-5):</label>
                    <input type="text" id="getaudiovolume" value="Current Volume">
                  </div>
                  <div class="field">
                    <input type="checkbox" id="talk" value="Talk">
                    <label for="talk" class="switch">Talk</label>
                  </div>
                  <div class="field">
                    <label for="audio_shift">Audio shift</label>
                    <input id="audio_shift" type="number" min="-5000" max="5000" step="1" value="0" size="6">
                  </div>
                </div>
              </div>
              <div id="backup_control">
                <div class="field-row">
                  <div class="field">
                    <label for="backup_checkbox" class="switch">Backup:</label>
                    <input id="backup_checkbox" type="checkbox">
                  </div>
                  <div class="field">
                    <label for="backup_filename" class="switch">Filename:</label>
                    <input type="text" id="backup_filename" value="">
                  </div>
                  <div class="field">
                    <label for="backup_time" class="switch">Backup Time:</label>
                    <input type="text" id="backup_time">
                  </div>
                  <div class="field">
                    <label for="media_record_start" class="switch">Capture:</label>
                    <button id="media_record_start">Capture</button>
                    <button id="media_record_stop">Stop</button>
                    <button id="media_record_show">Show</button>
                    <video id="displayVideo" autoplay="true" playsinline="" webkit-playsinline="1" controls="1" width="320" height="240" style="display:none"></video>
                  </div>
                </div>
              </div>
              <div id="instantplayback_control">
                <div class="field-row">
                  <div class="field">
                    <label for="instantplayback_checkbox" class="switch">Instant playback:</label>
                    <input id="instantplayback_checkbox" type="checkbox">
                  </div>
                  <div class="field">
                    <label for="instantplayback_start" class="switch">Start time (From):</label>
                    <input type="text" id="instantplayback_start" style="width: 30px;"> sec
                  </div>
                  <div class="field">
                    <label for="instantplayback_end" class="switch">End time (To):</label>
                    <input type="text" id="instantplayback_end" style="width: 30px;"> sec
                  </div>
                  <div class="field">
                    <button id="instantplayback_play_button">Play</button>
                    <button id="instantplayback_pause_button">Pause</button>
                  </div>
                  <div class="field">
                    <label for="instantplayback_seek_time" class="switch">Seek time:</label>
                    <input type="text" id="instantplayback_seek_time">
                    <button id="instantplayback_seek_button">Seek</button>
                  </div>
                </div>
              </div>
              <div id="screen">
                <div class="field-row">
                  <input type="checkbox" id="fullscreen">
                  <label for="fullscreen">Fullscreen</label>
                  <input type="checkbox" id="use_waiting_icon">
                  <label for="use_waiting_icon">Use Loading Icon when onwait state</label>
                </div>
              </div>
            </div>
            <div id="webdiv" class="sameRow" style="position:relative;justify-content:center;height:500px;min-height:500px;display:none">
              <webview id="webviewer" src="test.html" style="display:inline-flex; width:100%; height:100%;overflow-y: scroll;"></webview>
            </div>
          </div>
        </div>
        <div class="panel-stack">
          <div class="panel">
            <details id="debug_disclosure" class="disclosure">
              <summary class="disclosure-summary">
                <span class="panel-title disclosure-title">Debug Information</span>
                <span class="disclosure-chevron" aria-hidden="true"></span>
                <label for="use_debug" class="field">Use
                  <input type="checkbox" id="use_debug">
                </label>
                <button id="clear_debug">Clear</button>
              </summary>
              <div class="disclosure-content">
                <textarea id="debug" maxlength="5000" rows="50" cols="100"></textarea>
              </div>
            </details>
          </div>
          <div class="panel">
            <details id="discovery_disclosure" class="disclosure">
              <summary class="disclosure-summary">
                <span class="panel-title disclosure-title">Discovery</span>
                <span class="disclosure-chevron" aria-hidden="true"></span>
              </summary>
              <div class="disclosure-content">
                <textarea id="result" maxlength="10000" rows="10" cols="200"></textarea>
              </div>
            </details>
          </div>
        </div>
        <div class="panel-stack">
          <div class="panel">
            <details id="rtsp_disclosure" class="disclosure">
              <summary class="disclosure-summary">
                <span class="panel-title disclosure-title">RTSP</span>
                <span class="disclosure-chevron" aria-hidden="true"></span>
              </summary>
              <div class="disclosure-content">
                <textarea id="rtsp" maxlength="5000" rows="50" cols="100"></textarea>
              </div>
            </details>
          </div>
        </div>
      </div>
    </div>

    <div id="myModal" class="modal-popup">
      <div class="modal-content-popup">
        <span class="close-popup">&times;</span>
        <p class="message">Some text in the Modal..</p>
      </div>
    </div>

    <div id="myCapture" class="modal-popup">
      <div class="modal-content-popup" style="border: 1px;padding: 5px;">
        <span class="close-popup">&times;</span>
        <img id="capture" style="border:1px solid #ccc;padding: 5px 5px 5px 5px;min-height:50px;margin: 0px auto;" alt="Capture Image" width="640" height="480">
      </div>
    </div>
  </body>
</html>

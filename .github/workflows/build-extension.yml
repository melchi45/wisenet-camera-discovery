name: Build Extension

# Two ways to run this:
#   - push a tag like "v1.2.0" -> builds the zip AND attaches it to a new
#     GitHub Release for that tag.
#   - "Run workflow" button in the Actions tab (workflow_dispatch) -> builds
#     the zip and uploads it as a downloadable workflow artifact, no release
#     created.
#
# Either way, src/chrome-extension/manifest.json's "version" is stamped
# from package.json's "version" before the build (see
# scripts/sync-manifest-version.js) — package.json stays the single source
# of truth for the extension's version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write # only needed for the tag-push release step below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package.json depends on @melchi45/rtsp-over-websocket, published to
      # GitHub Packages rather than the public npm registry — npm needs an
      # authenticated .npmrc to resolve it. Create a classic PAT (or a
      # fine-grained one) with `read:packages` scope and add it as the repo
      # secret GH_PACKAGES_TOKEN (Settings -> Secrets and variables ->
      # Actions) before this workflow can succeed.
      - name: Configure npm auth for @melchi45 GitHub Packages
        run: |
          echo "@melchi45:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}" >> .npmrc

      - run: npm ci

      - name: Sync manifest.json version from package.json
        run: npm run version:sync-manifest

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # `npm run build:extension` alone (a raw tsc+vite invocation) does NOT
      # assemble dist/chrome-extension/ -- it only compiles background.js
      # into it, missing manifest.json and everything else the zip below
      # needs. `npm run build` (scripts/build.js's full orchestrator) is
      # what actually assembles a complete dist/chrome-extension/.
      - run: npm run build

      # dist/chrome-extension/'s window.html/window.js/scripts/socket.js are
      # then overwritten with the src/shared-v2/ rewrite -- see CLAUDE.md's
      # "src/shared-v2/ ... build output is no longer isolated" note. Without
      # this the released zip would ship the old src/shared/ UI.
      - run: npm run build:shared-v2

      - name: Zip dist/chrome-extension/
        run: |
          cd dist/chrome-extension
          zip -r "../../wisenet-camera-ip-installer-extension-${{ steps.pkg.outputs.version }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: wisenet-camera-ip-installer-extension-${{ steps.pkg.outputs.version }}
          path: wisenet-camera-ip-installer-extension-${{ steps.pkg.outputs.version }}.zip

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "wisenet-camera-ip-installer-extension-${{ steps.pkg.outputs.version }}.zip" \
            --title "${{ github.ref_name }}" \
            --generate-notes
